[pytest]
testpaths = tests
pythonpath =
    .
    src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -ra
    --strict-markers
    --strict-config
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    gpu: Tests requiring GPU
    network: Tests requiring network access
