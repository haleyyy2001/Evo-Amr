name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml setuptools wheel

      - name: Validate package metadata
        run: python setup.py --name

      - name: Run tests
        run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for accidental heavy artifacts
        run: |
          ! git ls-files | grep -E '(catboost_info|/trash/|temp_trash|\\.h5$|\\.pt$|\\.safetensors$|\\.tfevents)'
